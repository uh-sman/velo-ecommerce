name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push supersedes the run in progress; nobody needs the result for a
# commit that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  # ─── Secrets ──────────────────────────────────────────────────────────────
  # First, and independent: a leaked key should be caught before anything else
  # spends a runner minute (DISCOVERY.md R7).
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs history to scan the whole diff range
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── API ──────────────────────────────────────────────────────────────────
  api:
    name: API — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    # The same containers as local development (docker/docker-compose.dev.yml),
    # so search and media tests run in CI instead of skipping.
    env:
      VELO_MEILISEARCH_URL: http://127.0.0.1:7700
      VELO_MEILISEARCH_MASTER_KEY: local-dev-master-key
      VELO_S3_ENDPOINT_URL: http://127.0.0.1:9000
      VELO_S3_REGION: us-east-1
      VELO_S3_BUCKET: velo-media
      VELO_S3_ACCESS_KEY_ID: velo
      VELO_S3_SECRET_ACCESS_KEY: velo-dev-secret
      VELO_MEDIA_PUBLIC_URL: http://127.0.0.1:9000/velo-media

    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres, Redis, Meilisearch and S3
        working-directory: .
        run: docker compose -f docker/docker-compose.dev.yml up -d --wait postgres redis meilisearch s3

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-groups --frozen

      - name: Create the media bucket
        run: uv run python -m velo.scripts.storage_init

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy .

      # Unit and integration together, so the coverage gate (85%, pyproject.toml)
      # measures what the whole suite exercises. Contract tests run separately.
      - name: Tests and coverage gate
        env:
          VELO_RUN_INTEGRATION: "1"
          VELO_TEST_DATABASE_URL: postgresql+asyncpg://velo:velo@localhost:5432/velo_test
          VELO_TEST_REDIS_URL: redis://localhost:6379/1
        run: uv run pytest -m "not contract" --cov=velo --cov-report=term-missing

      # schemathesis against the published OpenAPI document: no 5xx, and every
      # status, content type and body as documented (tests/integration/test_contract.py).
      - name: Contract tests
        env:
          VELO_RUN_INTEGRATION: "1"
          VELO_TEST_DATABASE_URL: postgresql+asyncpg://velo:velo@localhost:5432/velo_test
          VELO_TEST_REDIS_URL: redis://localhost:6379/1
          VELO_CONTRACT_EXAMPLES: "20"
        run: uv run pytest -m contract

      - name: Export the OpenAPI document
        env:
          VELO_SECRET_KEY: ci-secret-key-that-is-long-enough-to-validate
          VELO_DATABASE_URL: postgresql+asyncpg://velo:velo@localhost:5432/velo_test
        run: uv run python scripts/export_openapi.py openapi.json

      # The frontends type-check against this, so it is the contract in transit.
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: apps/api/openapi.json

  # ─── Web ──────────────────────────────────────────────────────────────────
  web:
    name: Web — lint, types, build
    runs-on: ubuntu-latest
    needs: api # the generated client must match the API that just passed

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: apps/api

      - name: Generate the typed client
        run: pnpm --filter @velo/api-client generate:ci

      # If the generated types changed, the committed client is stale and some
      # call site has not been updated. Failing here is the entire point of
      # generating rather than hand-writing the client (ADR-001).
      - name: Fail if the generated client is out of date
        run: git diff --exit-code packages/api-client/src/schema.d.ts

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Vitest with the 75% coverage gate in each app's vitest.config.ts.
      - run: pnpm test:coverage
      - run: pnpm build

  # ─── End to end ───────────────────────────────────────────────────────────
  # Six customer and staff journeys on Chromium, Firefox and WebKit, with axe on
  # every page (e2e/). Payments go through the sandbox provider: no Stripe keys.
  e2e:
    name: E2E — Playwright, three browsers
    runs-on: ubuntu-latest
    needs: [api, web]
    timeout-minutes: 45
    env:
      CI: "true"
      E2E_DATABASE_URL: postgresql+asyncpg://velo:velo@127.0.0.1:5432/velo_e2e
      E2E_REDIS_URL: redis://127.0.0.1:6379/3
      E2E_SMTP_PORT: "1025"
    steps:
      - uses: actions/checkout@v4

      - name: Start the infrastructure
        run: docker compose -f docker/docker-compose.dev.yml up -d --wait

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
        working-directory: apps/api

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e:install

      - run: pnpm e2e

      - name: Keep the report, traces and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: |
            e2e/test-results
            e2e/playwright-report
            e2e/.logs

  # ─── Lighthouse ───────────────────────────────────────────────────────────
  # The performance budget (DISCOVERY.md §6.3, DESIGN-SYSTEM.md §7) on home,
  # a category and a product page: a production build against a seeded API,
  # on Lighthouse's throttled mid-range mobile profile. lighthouserc.json holds
  # the thresholds; a regression fails the build.
  lighthouse:
    name: Lighthouse — performance budget
    runs-on: ubuntu-latest
    needs: [api, web]
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      VELO_MEILISEARCH_URL: http://127.0.0.1:7700
      VELO_MEILISEARCH_MASTER_KEY: local-dev-master-key
      VELO_S3_ENDPOINT_URL: http://127.0.0.1:9000
      VELO_S3_REGION: us-east-1
      VELO_S3_BUCKET: velo-media
      VELO_S3_ACCESS_KEY_ID: velo
      VELO_S3_SECRET_ACCESS_KEY: velo-dev-secret
      VELO_MEDIA_PUBLIC_URL: http://127.0.0.1:9000/velo-media
    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres, Redis, Meilisearch and S3
        run: docker compose -f docker/docker-compose.dev.yml up -d --wait postgres redis meilisearch s3

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
        working-directory: apps/api

      - name: Migrate, seed and index the catalog
        working-directory: apps/api
        run: |
          uv run alembic upgrade head
          uv run python -m velo.scripts.storage_init
          uv run python -m velo.scripts.seed
          uv run python -m velo.scripts.reindex

      - name: Start the API
        working-directory: apps/api
        run: |
          nohup uv run uvicorn velo.main:app --host 127.0.0.1 --port 8000 > ../../api.log 2>&1 &
          timeout 60 sh -c 'until curl -sf http://127.0.0.1:8000/health; do sleep 1; done'

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build and start the storefront
        working-directory: apps/storefront
        run: |
          pnpm exec next build
          nohup pnpm exec next start --port 3000 > ../../storefront.log 2>&1 &
          timeout 60 sh -c 'until curl -sf http://127.0.0.1:3000/help/shipping > /dev/null; do sleep 1; done'

      - name: Run Lighthouse CI
        run: |
          PRODUCT=$(curl -sf "http://127.0.0.1:8000/api/v1/products?limit=1" | jq -r '.data[0].slug')
          npx --yes @lhci/cli@0.14.x autorun \
            --collect.url=http://127.0.0.1:3000/ \
            --collect.url=http://127.0.0.1:3000/categories/apparel \
            --collect.url="http://127.0.0.1:3000/products/${PRODUCT}"

      - name: Keep the reports and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: |
            .lighthouseci
            api.log
            storefront.log

  # ─── Docker ───────────────────────────────────────────────────────────────
  images:
    name: Images build
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Storefront image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          build-args: APP=storefront
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Branch protection requires this one job, so adding a check above never
  # means remembering to update a setting.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [secrets, api, web, e2e, lighthouse, images]
    if: always()
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All checks passed."
