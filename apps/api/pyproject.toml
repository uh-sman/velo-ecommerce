[project]
name = "velo-api"
version = "0.1.0"
description = "Velo Commerce API — headless commerce over PostgreSQL"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "python-ulid>=3.0.0",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "aiosmtplib>=3.0",
    "httpx>=0.27.2",
    "email-validator>=2.2",
    "arq>=0.28.0",
    "boto3>=1.35",
    "pillow>=11.3",
    "fpdf2>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "asgi-lifespan>=2.1.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "boto3-stubs[s3]>=1.43.104",
    "hypothesis>=6.112",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["velo"]

# ─── Ruff ──────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["velo", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes — every timestamp in this system is tz-aware
    "T20",       # print statements: use the logger
    "SIM",       # simplify
    "ASYNC",     # blocking calls in async paths
    "S",         # bandit security checks
    "RUF",
]
ignore = [
    "S101",  # assert — pytest uses it
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # hard-coded test credentials are fine in tests
"migrations/versions/**" = ["E501"]  # generated DDL: long constraint expressions read better whole

[tool.ruff.lint.isort]
known-first-party = ["velo"]

# ─── mypy ──────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_reexport = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ─── pytest ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires Postgres and Redis from docker/docker-compose.dev.yml",
    "concurrency: races real transactions; slow by design",
]

[tool.coverage.run]
# SQLAlchemy's asyncio layer switches greenlets; without this, coverage loses
# track of code that runs after a database await and under-reports badly.
concurrency = ["greenlet", "thread"]
branch = true
source = ["velo"]
